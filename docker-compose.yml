services:
  db:
    image: postgres:15
    container_name: ppe_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ppe_violations_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: ppe_rabbitmq
    restart: always
    env_file:
      - .env
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api_server:
    build: ./services/api_server
    container_name: ppe_api_server
    restart: always
    env_file:
      - .env
    ports:
      - "${API_SERVER_PORT}:8000"
    depends_on:
      - db
    volumes:
      - ./event_data:/app/event_data

  ingestor:
    build: ./services/ingestor
    container_name: ppe_ingestor
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media:ro
      - ./event_data:/app/event_data

  processor:
    build: ./services/processor
    container_name: ppe_processor
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./event_data:/app/event_data
      - ./models:/app/models

volumes:
  postgres_data:
  rabbitmq_data: