services:
  # --- 1. База данных ---
  db:
    image: postgres:15
    container_name: ppe_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432" # Пробрасываем порт для возможного подключения извне
    healthcheck:
      # Проверяем готовность БД утилитой pg_isready
      test: ["CMD-SHELL", "pg_isready -U admin -d ppe_violations_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Брокер сообщений ---
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: ppe_rabbitmq
    restart: always
    env_file:
      - .env
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}" # Веб-интерфейс
      - "5672:5672" # Порт для подключения клиентов
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # --- 3. Сервер инференса Triton ---
  # КЛЮЧЕВОЙ МОМЕНТ: Мы описываем два варианта.
  # Раскомментируйте нужный в зависимости от машины, на которой работаете.

  # --- Вариант для ноутбука (CPU) ---
  # triton:
  #   image: nvcr.io/nvidia/tritonserver:23.10-py3
  #   container_name: ppe_triton
  #   restart: always
  #   ports:
  #     - "8889:8000" # HTTP
  #     - "8886:8001" # GRPC
  #     - "8887:8002" # Metrics
  #   volumes:
  #     # Пробрасываем папку с 3 моделями
  #     - ./models:/models
  #   # Команда запуска. Важно: Triton сам найдет модели в папке /models
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 30s
  #   command: tritonserver --model-repository=/models

  # --- Вариант для сервера (GPU) ---
  # triton:
  #   image: nvcr.io/nvidia/tritonserver:23.10-py3
  #   container_name: ppe_triton
  #   restart: always
  #   ports:
  #     - "8889:8000" # HTTP
  #     - "8886:8001" # GRPC
  #     - "8887:8002" # Metrics
  #   volumes:
  #     - ./models:/models
  #   command: tritonserver --model-repository=/models
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # --- 4. Наши кастомные сервисы ---
  api_server:
    build: ./services/api_server
    container_name: ppe_api_server
    restart: always
    env_file:
      - .env
    ports:
      - "${API_SERVER_PORT}:8000" # Пробрасываем порт API наружу
    depends_on:
      - db
    volumes:
      # Монтируем папку событий для раздачи статики
      - ./event_data:/app/event_data

  ingestor:
    build: ./services/ingestor
    container_name: ppe_ingestor
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    # Для теста пробрасываем видеофайл явно, если нужно
    volumes:
      - ./test_video_h264.mp4:/app/test_video_h264.mp4
      - ./Dima.mp4:/app/Dima.mp4
      - ./Artem.mp4:/app/Artem.mp4
      - ./event_data:/app/event_data

  processor:
    build: ./services/processor
    container_name: ppe_processor
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      # triton:
      #   condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      # Монтируем ту же папку для записи
      - ./event_data:/app/event_data
      - ./models:/app/models

  # processor:
  #   build: ./services/processor
  #   container_name: ppe_processor
  #   restart: always
  #   env_file:
  #     - .env
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     triton: 
  #        condition: service_healthy
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./event_data:/app/event_data:Z
  #     # Пробрасываем модель людей внутрь
  #     - ./person.pt:/app/person.pt:Z 

volumes:
  postgres_data:
  rabbitmq_data: